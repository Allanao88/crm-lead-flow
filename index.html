<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="LeadFlow CRM — Gestão comercial de leads, contatos, empresas e estoque da AKS - Tech."
    />
    <meta name="theme-color" content="#0f1311" />
    <script>
      try {
        const savedTheme = localStorage.getItem('lead-flow-theme')
        const resolved = savedTheme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = resolved
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.setAttribute('content', resolved === 'light' ? '#edf3ee' : '#0f1311')
        }
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/brand/lead-flow-icon.svg" />
    <title>LeadFlow CRM | AKS - Tech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
